name: SQL consistency

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Your_Strong_Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_Strong_Password123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development
      Identity__Enabled: 'true'
      ConnectionStrings__DefaultConnection: 'Server=localhost,1433;Database=WalletDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;'
      WALLET_TEST_CONNECTION: 'Server=localhost,1433;Database=WalletDb;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;'
      Jwt__Key: 'dGhpcy1pcy1hLXZlcnktc3Ryb25nLXNlY3JldC1rZXktZm9yLXRlc3RpbmctcHVycG9zZXM='
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restaurar y compilar
        run: |
          dotnet restore Wallet.slnx
          dotnet tool restore
          dotnet build Wallet.slnx -c Release --no-restore
      - name: Aplicar migraciones sobre la base de pruebas
        run: dotnet ef database update --project Wallet.Infrastructure --startup-project Wallet.Api --configuration Release --no-build
      - name: Ejecutar pruebas SQL
        run: dotnet test Wallet.slnx -c Release --no-build --no-restore --filter 'Category=Sql' --logger trx --results-directory TestResults/Sql
      - name: Confirmar que no hay pruebas SQL omitidas
        run: python3 scripts/testing/verify-sql-results.py TestResults/Sql
      - name: Conservar evidencia SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-test-results
          path: TestResults/Sql/*.trx
          if-no-files-found: warn
          retention-days: 7
